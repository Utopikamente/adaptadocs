name: Comprobaciones

on:
  push:
    branches: [main]
  pull_request:

jobs:
  prueba:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Comprobación de formato
        run: python prueba.py
      - name: Comprobación de la capa de IA (sin red)
        run: python prueba_ia.py
      - name: Comprobación de la hoja de registro
        run: python prueba_registro.py
      - name: Comprobación del Anexo III.b (ACIS)
        run: python prueba_acis.py
      - name: Comprobación del lector de programaciones
        run: python prueba_programacion.py
      - name: Comprobación de la adaptación curricular con IA (sin red)
        run: python prueba_acis_ia.py
      - name: Comprobación de las orientaciones de la ACIS
        run: python prueba_acis_orientaciones.py
