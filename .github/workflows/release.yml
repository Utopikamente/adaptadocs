name: Publicar ejecutable

# Se lanza al crear una etiqueta como v1.0.0
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r dev-requirements.txt

      - name: Generar icono
        run: python recursos/crear_icono.py

      - name: Construir (carpeta --onedir)
        run: >
          pyinstaller --noconfirm --onedir --windowed
          --name "Adaptadocs"
          --icon recursos/icono.ico
          --version-file recursos/version_info.txt
          --add-data "core/registro.json;core"
          --add-data "core/acis.json;core"
          --collect-all tkinterdnd2
          --collect-all anthropic
          --collect-all keyring
          --collect-submodules keyring.backends
          app.py

      - name: Versión y empaquetado
        id: pack
        shell: pwsh
        run: |
          Compress-Archive -Path dist/Adaptadocs -DestinationPath "dist/Adaptadocs-portable.zip" -Force
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          & $iscc instalador.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup ha fallado." }
          Get-ChildItem dist -File | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$h  $($_.Name)" | Out-File -Encoding ascii "$($_.FullName).sha256"
          }
          Get-ChildItem dist -File | Select-Object Name, Length

      - name: Subir artefacto de la ejecución
        uses: actions/upload-artifact@v4
        with:
          name: adaptadocs-windows
          path: |
            dist/AdaptadocsSetup.exe
            dist/Adaptadocs-portable.zip
            dist/*.sha256

      - name: Publicar en la Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AdaptadocsSetup.exe
            dist/Adaptadocs-portable.zip
            dist/*.sha256
          generate_release_notes: true
